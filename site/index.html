<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avouch</title>
<meta name="robots" content="noindex">
<link rel="alternate" hreflang="ko" href="/ko/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="x-default" href="/en/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css?v=20261024b">
<script>
(function () {
  // 1) explicit choice, 2) browser languages, 3) English default
  var saved = null;
  try { saved = localStorage.getItem('avouch_lang'); } catch (e) {}
  var cookie = document.cookie.match(/(?:^|;\s*)lang=([^;]+)/);
  if (cookie) saved = decodeURIComponent(cookie[1]);
  var langs = navigator.languages || [navigator.language || 'en'];
  var lang = saved === 'ko' || saved === 'en' ? saved
    : (langs.join(',').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
  location.replace('/' + lang + '/');
})();
</script>
</head>
<body>
<div class="wrap" style="padding:80px 24px">
  <div class="brand" style="font-size:18px;margin-bottom:14px">AVOUCH<span>.</span></div>
  <p class="lede">언어를 선택하세요 / Choose a language</p>
  <div class="btn-row">
    <a class="btn primary" href="/ko/">한국어</a>
    <a class="btn" href="/en/">English</a>
  </div>
</div>
</body>
</html>
