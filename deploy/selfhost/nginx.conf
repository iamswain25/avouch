# locale routing: explicit cookie wins, then Accept-Language, English as default
map $cookie_lang $lang_cookie {
    default "";
    "~*^ko$" "ko";
    "~*^en$" "en";
}

map $http_accept_language $lang_header {
    default  "en";
    "~*ko"   "ko";
}

server {
    listen 80;
    server_name avouchprotocol.com www.avouchprotocol.com _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    # relative Location headers: safe behind TLS-terminating proxies (Caddy/Cloudflare)
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # "/" -> /ko/ or /en/ (cookie first, then Accept-Language)
    location = / {
        add_header Vary "Accept-Language, Cookie";
        add_header Cache-Control "no-store";
        if ($lang_cookie != "") {
            return 302 /$lang_cookie/;
        }
        return 302 /$lang_header/;
    }

    location = /ko { return 301 /ko/; }
    location = /en { return 301 /en/; }

    # HTML always revalidates so a redeploy is visible immediately
    location ~ ^/(index\.html|ko/|en/)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location ~ ^/(ko|en)/(whitepaper\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/(ko|en)/index\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # static assets: cache hard
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location / {
        # parity with Cloudflare Pages: /ko/whitepaper serves /ko/whitepaper.html
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}
