services:
  site:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: avouch-site:selfhost
    container_name: avouch-site
    ports:
      - "8787:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
